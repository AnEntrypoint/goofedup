name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-bump patch version BEFORE build
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lanmower"
          git config user.email "657315+lanmower@users.noreply.github.com"
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.toml
          cargo update -p goofedup --precise "$NEW_VERSION" 2>/dev/null || true
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version change needed"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main hit a real conflict; refusing to auto-resolve."
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:main
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: goofedup-windows-x64.exe
            bin_name: goofedup.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: goofedup-windows-arm64.exe
            bin_name: goofedup.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: goofedup-macos-x64
            bin_name: goofedup
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: goofedup-macos-arm64
            bin_name: goofedup
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: goofedup-linux-x64
            bin_name: goofedup
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: goofedup-linux-arm64
            bin_name: goofedup
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: false

      - name: Install cross-compilation linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.bump.outputs.version }}
          BUILT_SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -e
          if ! gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "${{ github.repository }}" \
              --title "goofedup v$VER" \
              --notes "Auto-published multiplatform build from $BUILT_SHA."
          fi
          gh release upload "v$VER" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/*
