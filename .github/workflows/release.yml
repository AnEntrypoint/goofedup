name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Check out repository (actions/checkout v5)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Derive release version from Cargo.toml and the run number
        id: derive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"//;s/".*//')
          if gh release view "v$CARGO_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            VERSION="$CARGO_VERSION-build.${{ github.run_number }}"
          else
            VERSION="$CARGO_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: goofedup-windows-x64.exe
            bin_name: goofedup.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: goofedup-windows-arm64.exe
            bin_name: goofedup.exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: goofedup-gui-windows-x64.exe
            bin_name: goofedup-gui.exe
            gui: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: goofedup-gui-windows-arm64.exe
            bin_name: goofedup-gui.exe
            gui: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: goofedup-macos-x64
            bin_name: goofedup
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: goofedup-macos-arm64
            bin_name: goofedup
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: goofedup-linux-x64
            bin_name: goofedup
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: goofedup-linux-arm64
            bin_name: goofedup
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository (actions/checkout v5)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain (dtolnay/rust-toolchain stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo build (Swatinem/rust-cache v2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: false

      - name: Install cross-compilation linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.gui }}" = "true" ]; then
            cargo build --release --target ${{ matrix.target }} --features gui --bin goofedup-gui
          else
            cargo build --release --target ${{ matrix.target }} --bin goofedup
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact (actions/upload-artifact v4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download built artifacts (actions/download-artifact v4)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance (actions/attest-build-provenance v4.2.2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -e
          if ! gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "${{ github.repository }}" \
              --target "$BUILT_SHA" \
              --title "goofedup v$VER" \
              --notes "Auto-published multiplatform build from $BUILT_SHA."
          fi
          gh release upload "v$VER" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/*
