[package]
name = "goofedup"
version = "0.1.38"
edition = "2021"
description = "Cross-platform structural-anomaly watcher: catches malware by shape, not signature."
license = "MIT"
repository = "https://github.com/AnEntrypoint/goofedup"

[lib]
name = "goofedup"
path = "src/lib.rs"

[[bin]]
name = "goofedup"
path = "src/main.rs"

[[bin]]
name = "goofedup-gui"
path = "src/bin/goofedup_gui.rs"
required-features = ["gui"]

[dependencies]
notify = "8"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
walkdir = "2"
tray-icon = { version = "0.24", optional = true }
tao = { version = "0.36", optional = true }

[features]
gui = ["dep:tray-icon", "dep:tao"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_Etw",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_EnhancedStorage",
  "Data_Xml_Dom",
  "UI_Notifications",
] }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(target_os = "macos")'.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
